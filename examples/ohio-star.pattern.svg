<svg xmlns="http://www.w3.org/2000/svg" width="24mm" height="24mm" viewBox="0 0 24 24">
<metadata id="tessafab">{"form": {"components": [{"decimalLimit": 3, "defaultValue": 0.4, "delimiter": false, "description": "The groove between tiles that shows each tile.", "input": true, "key": "grout", "label": "Grout", "properties": {"step": "0.05"}, "requireDecimal": false, "suffix": "mm", "type": "number", "validate": {"integer": false, "max": 3.0, "min": 0.0, "required": true}}]}, "groups": {"#24456b": "Centre", "#3f7f8c": "Corner diamonds", "#c4623f": "Star points", "#e0a83a": "Inner points", "#efe3c8": "Background"}, "name": "Ohio star"}</metadata>
<title>Ohio star</title>
<!-- A quilt block: an eight-point star, 24 mm square, five tile groups.
     Blocks meet at the corners, where the teal diamonds join up. -->
