<?xml version="1.0" encoding="UTF-8"?>
<!-- Garden lattice pattern for TessaFab (made by pattern_library.py)
     12 mm squares framed by 4 mm bars with small squares at the crossings, 0.4 mm grout.
     The page is one repeat (16 x 16 mm): the pattern is copied every page width across and
     every page height up, so tiles hanging over the page edge are completed by the next copy.
     fill = tile; blue stroke = grout (width = groove in mm); light red = line direction per colour,
     closed red loop = concentric rings. No black outlines: those come from the model's layout. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="16.0000mm" height="16.0000mm" viewBox="0 0 16.0000 16.0000"
     data-pattern="{&quot;id&quot;: &quot;garden_lattice&quot;, &quot;values&quot;: {&quot;bar&quot;: 4.0, &quot;grout&quot;: 0.4, &quot;square&quot;: 12.0}}">
<title>Garden lattice</title>
<g inkscape:groupmode="layer" inkscape:label="tiles" stroke="#0000ff" stroke-width="0.4" stroke-linejoin="miter">
  <polygon fill="#efe3c8" points="0.0000,16.0000 12.0000,16.0000 12.0000,4.0000 0.0000,4.0000"/>
  <polygon fill="#d9c49a" points="0.0000,4.0000 12.0000,4.0000 12.0000,0.0000 0.0000,0.0000"/>
  <polygon fill="#c4744f" points="12.0000,16.0000 16.0000,16.0000 16.0000,4.0000 12.0000,4.0000"/>
  <polygon fill="#2f4a6b" points="12.0000,4.0000 16.0000,4.0000 16.0000,0.0000 12.0000,0.0000"/>
</g>
<g inkscape:groupmode="layer" inkscape:label="directions" fill="none" stroke="#ff8080" stroke-width="0.5">
  <circle cx="6.0000" cy="10.0000" r="1.20"/>   <!-- #efe3c8 tiles: concentric rings -->
  <line x1="2.5000" y1="2.0000" x2="9.5000" y2="2.0000"/>   <!-- #d9c49a tiles: lines at 0 deg -->
  <line x1="14.0000" y1="13.5000" x2="14.0000" y2="6.5000"/>   <!-- #c4744f tiles: lines at 90 deg -->
  <line x1="13.1090" y1="2.8910" x2="14.8910" y2="1.1090"/>   <!-- #2f4a6b tiles: lines at 45 deg -->
</g>
</svg>
