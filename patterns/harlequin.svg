<?xml version="1.0" encoding="UTF-8"?>
<!-- Harlequin pattern for TessaFab (made by pattern_library.py)
     Diamonds 12 mm wide and 18 mm tall in alternating colours, 0.4 mm grout.
     The page is one repeat (12 x 18 mm): the pattern is copied every page width across and
     every page height up, so tiles hanging over the page edge are completed by the next copy.
     fill = tile; blue stroke = grout (width = groove in mm); light red = line direction per colour,
     closed red loop = concentric rings. No black outlines: those come from the model's layout. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="12.0000mm" height="18.0000mm" viewBox="0 0 12.0000 18.0000"
     data-pattern="{&quot;id&quot;: &quot;harlequin&quot;, &quot;values&quot;: {&quot;grout&quot;: 0.4, &quot;height&quot;: 18.0, &quot;width&quot;: 12.0}}">
<title>Harlequin</title>
<g inkscape:groupmode="layer" inkscape:label="tiles" stroke="#0000ff" stroke-width="0.4" stroke-linejoin="miter">
  <polygon fill="#8ec3c9" points="6.0000,18.0000 12.0000,9.0000 6.0000,0.0000 0.0000,9.0000"/>
  <polygon fill="#3f7f8c" points="0.0000,27.0000 6.0000,18.0000 0.0000,9.0000 -6.0000,18.0000"/>
</g>
<g inkscape:groupmode="layer" inkscape:label="directions" fill="none" stroke="#ff8080" stroke-width="0.5">
  <line x1="4.2915" y1="11.5627" x2="7.7085" y2="6.4373"/>   <!-- #8ec3c9 tiles: lines at 56.31 deg -->
  <line x1="-1.7085" y1="15.4373" x2="1.7085" y2="20.5627"/>   <!-- #3f7f8c tiles: lines at -56.31 deg -->
</g>
</svg>
