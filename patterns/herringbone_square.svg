<title>Herringbone, Square</title>
<g inkscape:groupmode="layer" inkscape:label="tiles" stroke="#0000ff" stroke-width="0.4" stroke-linejoin="miter">
  <polygon fill="#d8b07a" points="0.0000,24.0000 12.0000,24.0000 12.0000,20.0000 0.0000,20.0000"/>
  <polygon fill="#d8b07a" points="4.0000,20.0000 16.0000,20.0000 16.0000,16.0000 4.0000,16.0000"/>
  <polygon fill="#d8b07a" points="-4.0000,4.0000 8.0000,4.0000 8.0000,0.0000 -4.0000,0.0000"/>
