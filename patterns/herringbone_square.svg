  <polygon fill="#d8b07a" points="12.0000,12.0000 24.0000,12.0000 24.0000,8.0000 12.0000,8.0000"/>
  <polygon fill="#d8b07a" points="16.0000,8.0000 28.0000,8.0000 28.0000,4.0000 16.0000,4.0000"/>
  <polygon fill="#9c6a3c" points="0.0000,20.0000 4.0000,20.0000 4.0000,8.0000 0.0000,8.0000"/>
  <polygon fill="#9c6a3c" points="4.0000,16.0000 8.0000,16.0000 8.0000,4.0000 4.0000,4.0000"/>
  <polygon fill="#9c6a3c" points="16.0000,28.0000 20.0000,28.0000 20.0000,16.0000 16.0000,16.0000"/>
  <polygon fill="#9c6a3c" points="8.0000,12.0000 12.0000,12.0000 12.0000,0.0000 8.0000,0.0000"/>
  <polygon fill="#9c6a3c" points="20.0000,24.0000 24.0000,24.0000 24.0000,12.0000 20.0000,12.0000"/>
  <polygon fill="#9c6a3c" points="12.0000,8.0000 16.0000,8.0000 16.0000,-4.0000 12.0000,-4.0000"/>
</g>
<g inkscape:groupmode="layer" inkscape:label="directions" fill="none" stroke="#ff8080" stroke-width="0.5">
