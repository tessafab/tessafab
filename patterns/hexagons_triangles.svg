<?xml version="1.0" encoding="UTF-8"?>
<!-- Hexagons and triangles pattern for TessaFab (made by pattern_library.py)
     Hexagons and triangles with 6 mm sides (trihexagonal), 0.4 mm grout.
     The page is one repeat (12 x 20.78 mm): the pattern is copied every page width across and
     every page height up, so tiles hanging over the page edge are completed by the next copy.
     fill = tile; blue stroke = grout (width = groove in mm); light red = line direction per colour,
     closed red loop = concentric rings. No black outlines: those come from the model's layout. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="12.0000mm" height="20.7846mm" viewBox="0 0 12.0000 20.7846"
     data-pattern="{&quot;id&quot;: &quot;hexagons_triangles&quot;, &quot;values&quot;: {&quot;grout&quot;: 0.4, &quot;side&quot;: 6.0}}">
<title>Hexagons and triangles</title>
<g inkscape:groupmode="layer" inkscape:label="tiles" stroke="#0000ff" stroke-width="0.4" stroke-linejoin="miter">
  <polygon fill="#d9c49a" points="6.0000,20.7846 3.0000,15.5885 -3.0000,15.5885 -6.0000,20.7846 -3.0000,25.9808 3.0000,25.9808"/>
  <polygon fill="#d9c49a" points="12.0000,10.3923 9.0000,5.1962 3.0000,5.1962 0.0000,10.3923 3.0000,15.5885 9.0000,15.5885"/>
  <polygon fill="#3f7f8c" points="0.0000,10.3923 3.0000,5.1962 -3.0000,5.1962"/>
  <polygon fill="#3f7f8c" points="6.0000,20.7846 9.0000,15.5885 3.0000,15.5885"/>
  <polygon fill="#3f7f8c" points="3.0000,15.5885 0.0000,10.3923 -3.0000,15.5885"/>
  <polygon fill="#3f7f8c" points="9.0000,5.1962 6.0000,0.0000 3.0000,5.1962"/>
</g>
<g inkscape:groupmode="layer" inkscape:label="directions" fill="none" stroke="#ff8080" stroke-width="0.5">
  <circle cx="6.0000" cy="10.3923" r="1.20"/>   <!-- #d9c49a tiles: concentric rings -->
  <line x1="5.3000" y1="3.4641" x2="6.7000" y2="3.4641"/>   <!-- #3f7f8c tiles: lines at 0 deg -->
</g>
</svg>
