<?xml version="1.0" encoding="UTF-8"?>
<!-- Hopscotch pattern for TessaFab (made by pattern_library.py)
     8 mm and 4 mm squares, big squares lined at 45 deg, small ones in rings, 0.5 mm grout.
     The page is one repeat (20 x 20 mm): the pattern is copied every page width across and
     every page height up, so tiles hanging over the page edge are completed by the next copy.
     fill = tile; blue stroke = grout (width = groove in mm); light red = line direction per colour,
     closed red loop = concentric rings. No black outlines: those come from the model's layout. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="20.0000mm" height="20.0000mm" viewBox="0 0 20.0000 20.0000"
     data-pattern="{&quot;id&quot;: &quot;hopscotch&quot;, &quot;values&quot;: {&quot;grout&quot;: 0.5, &quot;unit&quot;: 4.0}}">
<title>Hopscotch</title>
<g inkscape:groupmode="layer" inkscape:label="tiles" stroke="#0000ff" stroke-width="0.5" stroke-linejoin="miter">
  <polygon fill="#d8b07a" points="0.0000,20.0000 8.0000,20.0000 8.0000,12.0000 0.0000,12.0000"/>
  <polygon fill="#d8b07a" points="-4.0000,12.0000 4.0000,12.0000 4.0000,4.0000 -4.0000,4.0000"/>
  <polygon fill="#d8b07a" points="12.0000,24.0000 20.0000,24.0000 20.0000,16.0000 12.0000,16.0000"/>
  <polygon fill="#d8b07a" points="8.0000,16.0000 16.0000,16.0000 16.0000,8.0000 8.0000,8.0000"/>
  <polygon fill="#d8b07a" points="4.0000,8.0000 12.0000,8.0000 12.0000,0.0000 4.0000,0.0000"/>
  <polygon fill="#9c6a3c" points="8.0000,20.0000 12.0000,20.0000 12.0000,16.0000 8.0000,16.0000"/>
  <polygon fill="#9c6a3c" points="4.0000,12.0000 8.0000,12.0000 8.0000,8.0000 4.0000,8.0000"/>
  <polygon fill="#9c6a3c" points="0.0000,4.0000 4.0000,4.0000 4.0000,0.0000 0.0000,0.0000"/>
  <polygon fill="#9c6a3c" points="16.0000,16.0000 20.0000,16.0000 20.0000,12.0000 16.0000,12.0000"/>
  <polygon fill="#9c6a3c" points="12.0000,8.0000 16.0000,8.0000 16.0000,4.0000 12.0000,4.0000"/>
</g>
<g inkscape:groupmode="layer" inkscape:label="directions" fill="none" stroke="#ff8080" stroke-width="0.5">
  <line x1="9.6984" y1="14.3016" x2="14.3016" y2="9.6984"/>   <!-- #d8b07a tiles: lines at 45 deg -->
  <circle cx="6.0000" cy="10.0000" r="1.20"/>   <!-- #9c6a3c tiles: concentric rings -->
</g>
</svg>
