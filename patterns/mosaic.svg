  <line x1="16.4425" y1="12.5000" x2="18.5075" y2="12.5000"/>   <!-- #8ec3c9 tiles: lines at 0 deg -->
  <line x1="12.5000" y1="18.5575" x2="12.5000" y2="16.4925"/>   <!-- #3f7f8c tiles: lines at 90 deg -->
  <line x1="11.2626" y1="23.7374" x2="13.7374" y2="21.2626"/>   <!-- #efe3c8 tiles: lines at 45 deg -->
</g>
