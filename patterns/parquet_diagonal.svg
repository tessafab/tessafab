<?xml version="1.0" encoding="UTF-8"?>
<!-- Diagonal parquet pattern for TessaFab (made by pattern_library.py)
     10 mm squares, lines at 45 deg and -45 deg in a checkerboard, 0.4 mm grout.
     The page is one repeat (20 x 20 mm): the pattern is copied every page width across and
     every page height up, so tiles hanging over the page edge are completed by the next copy.
     fill = tile; blue stroke = grout (width = groove in mm); light red = line direction per colour,
     closed red loop = concentric rings. No black outlines: those come from the model's layout. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="20.0000mm" height="20.0000mm" viewBox="0 0 20.0000 20.0000"
     data-pattern="{&quot;id&quot;: &quot;parquet_diagonal&quot;, &quot;values&quot;: {&quot;grout&quot;: 0.4, &quot;square&quot;: 10.0}}">
<title>Diagonal parquet</title>
<g inkscape:groupmode="layer" inkscape:label="tiles" stroke="#0000ff" stroke-width="0.4" stroke-linejoin="miter">
  <polygon fill="#d8b07a" points="0.0000,20.0000 10.0000,20.0000 10.0000,10.0000 0.0000,10.0000"/>
  <polygon fill="#d8b07a" points="10.0000,10.0000 20.0000,10.0000 20.0000,0.0000 10.0000,0.0000"/>
  <polygon fill="#9c6a3c" points="0.0000,10.0000 10.0000,10.0000 10.0000,0.0000 0.0000,0.0000"/>
  <polygon fill="#9c6a3c" points="10.0000,20.0000 20.0000,20.0000 20.0000,10.0000 10.0000,10.0000"/>
</g>
<g inkscape:groupmode="layer" inkscape:label="directions" fill="none" stroke="#ff8080" stroke-width="0.5">
  <line x1="2.0054" y1="17.9946" x2="7.9946" y2="12.0054"/>   <!-- #d8b07a tiles: lines at 45 deg -->
  <line x1="2.0054" y1="2.0054" x2="7.9946" y2="7.9946"/>   <!-- #9c6a3c tiles: lines at -45 deg -->
</g>
</svg>
