<?xml version="1.0" encoding="UTF-8"?>
<!-- Running bond, Linear pattern for TessaFab (made by pattern_library.py)
     Bricks 36 x 4 mm, each row shifted half a brick, 0.4 mm grout.
     The page is one repeat (36 x 12 mm): the pattern is copied every page width across and
     every page height up, so tiles hanging over the page edge are completed by the next copy.
     fill = tile; blue stroke = grout (width = groove in mm); light red = line direction per colour,
     closed red loop = concentric rings. No black outlines: those come from the model's layout. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="36.0000mm" height="12.0000mm" viewBox="0 0 36.0000 12.0000"
     data-pattern="{&quot;id&quot;: &quot;running_bond&quot;, &quot;values&quot;: {&quot;brick_height&quot;: 4.0, &quot;brick_length&quot;: 36.0, &quot;grout&quot;: 0.4, &quot;offset&quot;: &quot;third&quot;}}">
<title>Running bond, Linear</title>
<g inkscape:groupmode="layer" inkscape:label="tiles" stroke="#0000ff" stroke-width="0.4" stroke-linejoin="miter">
  <polygon fill="#b5562f" points="-12.0000,4.0000 24.0000,4.0000 24.0000,0.0000 -12.0000,0.0000"/>
  <polygon fill="#b5562f" points="0.0000,12.0000 36.0000,12.0000 36.0000,8.0000 0.0000,8.0000"/>
  <polygon fill="#b5562f" points="12.0000,8.0000 48.0000,8.0000 48.0000,4.0000 12.0000,4.0000"/>
</g>
<g inkscape:groupmode="layer" inkscape:label="directions" fill="none" stroke="#ff8080" stroke-width="0.5">
  <line x1="6.1350" y1="10.0000" x2="29.8650" y2="10.0000"/>   <!-- #b5562f tiles: lines at 0 deg -->
</g>
</svg>
