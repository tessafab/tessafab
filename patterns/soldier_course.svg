<?xml version="1.0" encoding="UTF-8"?>
<!-- Soldier course pattern for TessaFab (made by pattern_library.py)
     3 rows of running bond bricks (12 x 6 mm) then a row standing up, 0.5 mm grout.
     The page is one repeat (12 x 30 mm): the pattern is copied every page width across and
     every page height up, so tiles hanging over the page edge are completed by the next copy.
     fill = tile; blue stroke = grout (width = groove in mm); light red = line direction per colour,
     closed red loop = concentric rings. No black outlines: those come from the model's layout. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="12.0000mm" height="30.0000mm" viewBox="0 0 12.0000 30.0000"
     data-pattern="{&quot;id&quot;: &quot;soldier_course&quot;, &quot;values&quot;: {&quot;brick_height&quot;: 6.0, &quot;grout&quot;: 0.5, &quot;rows&quot;: 3}}">
<title>Soldier course</title>
<g inkscape:groupmode="layer" inkscape:label="tiles" stroke="#0000ff" stroke-width="0.5" stroke-linejoin="miter">
  <polygon fill="#b5562f" points="0.0000,30.0000 12.0000,30.0000 12.0000,24.0000 0.0000,24.0000"/>
  <polygon fill="#b5562f" points="-6.0000,24.0000 6.0000,24.0000 6.0000,18.0000 -6.0000,18.0000"/>
  <polygon fill="#b5562f" points="0.0000,18.0000 12.0000,18.0000 12.0000,12.0000 0.0000,12.0000"/>
  <polygon fill="#c4744f" points="0.0000,12.0000 6.0000,12.0000 6.0000,0.0000 0.0000,0.0000"/>
  <polygon fill="#c4744f" points="6.0000,12.0000 12.0000,12.0000 12.0000,0.0000 6.0000,0.0000"/>
</g>
<g inkscape:groupmode="layer" inkscape:label="directions" fill="none" stroke="#ff8080" stroke-width="0.5">
  <line x1="2.5000" y1="15.0000" x2="9.5000" y2="15.0000"/>   <!-- #b5562f tiles: lines at 0 deg -->
  <line x1="3.0000" y1="9.5000" x2="3.0000" y2="2.5000"/>   <!-- #c4744f tiles: lines at 90 deg -->
</g>
</svg>
