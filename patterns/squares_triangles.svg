<g inkscape:groupmode="layer" inkscape:label="tiles" stroke="#0000ff" stroke-width="0.4" stroke-linejoin="miter">
  <polygon fill="#efe3c8" points="-4.0000,14.9282 4.0000,14.9282 4.0000,6.9282 -4.0000,6.9282"/>
  <polygon fill="#efe3c8" points="0.0000,29.8564 8.0000,29.8564 8.0000,21.8564 0.0000,21.8564"/>
