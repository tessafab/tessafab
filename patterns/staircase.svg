  <polygon fill="#d9c49a" points="12.0000,24.0000 24.0000,24.0000 24.0000,18.0000 18.0000,18.0000 18.0000,12.0000 12.0000,12.0000"/>
  <polygon fill="#d9c49a" points="30.0000,24.0000 42.0000,24.0000 42.0000,18.0000 36.0000,18.0000 36.0000,12.0000 30.0000,12.0000"/>
  <polygon fill="#d9c49a" points="6.0000,12.0000 18.0000,12.0000 18.0000,6.0000 12.0000,6.0000 12.0000,0.0000 6.0000,0.0000"/>
  <polygon fill="#d9c49a" points="24.0000,12.0000 36.0000,12.0000 36.0000,6.0000 30.0000,6.0000 30.0000,0.0000 24.0000,0.0000"/>
  <polygon fill="#5f6b75" points="6.0000,30.0000 18.0000,30.0000 18.0000,24.0000 12.0000,24.0000 12.0000,18.0000 6.0000,18.0000"/>
  <polygon fill="#5f6b75" points="24.0000,30.0000 36.0000,30.0000 36.0000,24.0000 30.0000,24.0000 30.0000,18.0000 24.0000,18.0000"/>
  <polygon fill="#5f6b75" points="0.0000,18.0000 12.0000,18.0000 12.0000,12.0000 6.0000,12.0000 6.0000,6.0000 0.0000,6.0000"/>
  <polygon fill="#5f6b75" points="18.0000,18.0000 30.0000,18.0000 30.0000,12.0000 24.0000,12.0000 24.0000,6.0000 18.0000,6.0000"/>
  <polygon fill="#5f6b75" points="12.0000,6.0000 24.0000,6.0000 24.0000,0.0000 18.0000,0.0000 18.0000,-6.0000 12.0000,-6.0000"/>
  <polygon fill="#5f6b75" points="30.0000,6.0000 42.0000,6.0000 42.0000,0.0000 36.0000,0.0000 36.0000,-6.0000 30.0000,-6.0000"/>
</g>
<g inkscape:groupmode="layer" inkscape:label="directions" fill="none" stroke="#ff8080" stroke-width="0.5">
  <line x1="14.5000" y1="19.0000" x2="21.5000" y2="19.0000"/>   <!-- #d9c49a tiles: lines at 0 deg -->
  <line x1="23.0000" y1="15.5000" x2="23.0000" y2="8.5000"/>   <!-- #5f6b75 tiles: lines at 90 deg -->
</g>
